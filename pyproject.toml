[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents draw, edit and simulate Labcenter Proteus 8 projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahmoud Elghamry" }]
keywords = ["proteus", "mcp", "eda", "simulation", "labcenter", "kicad"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
proteus-mcp = "proteus_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["proteus: needs a real Proteus 8 install (slow, opens Proteus)"]
